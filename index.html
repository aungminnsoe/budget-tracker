<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a12">
<title>Budget Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,500;9..40,700;9..40,800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a12;--bg2:rgba(255,255,255,0.03);--border:rgba(255,255,255,0.06);
  --text:#fff;--text2:rgba(255,255,255,0.7);--text3:rgba(255,255,255,0.4);--text4:rgba(255,255,255,0.2);
  --income:#fbbf24;--needs:#60a5fa;--wants:#f472b6;--savings:#34d399;--danger:#ff6b6b;
  --radius:12px;--font:'DM Sans',sans-serif;--mono:'JetBrains Mono',monospace;
}
html,body{margin:0;padding:0;width:100%;min-height:100vh}
html{background:var(--bg);color:var(--text);font-family:var(--font);-webkit-tap-highlight-color:transparent;font-size:14px}
body{background:linear-gradient(160deg,#0a0a12 0%,#0d0d18 50%,#0a0f14 100%);padding-bottom:60px;overflow-x:hidden}
input,button,select{font-family:inherit}
button{cursor:pointer;-webkit-appearance:none}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:0.3}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.fade-up{animation:fadeUp 0.35s ease both}
.d1{animation-delay:0.04s}.d2{animation-delay:0.08s}.d3{animation-delay:0.12s}.d4{animation-delay:0.16s}

/* Quote banner */
.quote-banner{padding:10px 16px;background:linear-gradient(135deg,rgba(251,191,36,0.06),rgba(52,211,153,0.04));border-bottom:1px solid var(--border);min-height:44px;display:flex;align-items:center}
.quote-text{font-size:11px;color:var(--text3);line-height:1.5;font-style:italic;text-align:center;width:100%}
.quote-text span{color:var(--income);font-weight:600;font-style:normal}
.quote-shimmer{height:12px;width:70%;margin:0 auto;border-radius:6px;background:linear-gradient(90deg,rgba(255,255,255,0.03) 25%,rgba(255,255,255,0.06) 50%,rgba(255,255,255,0.03) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}

.login-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;text-align:center}
.login-logo{font-size:52px;margin-bottom:14px}
.login-title{font-size:24px;font-weight:800;letter-spacing:-0.5px;margin-bottom:4px}
.login-sub{font-size:12px;color:var(--text3);margin-bottom:28px;line-height:1.5}
.login-btn{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:13px 26px;color:#fff;font-size:14px;font-weight:600;transition:all 0.2s}
.login-btn:active{transform:scale(0.97);background:rgba(255,255,255,0.1)}
.login-btn img{width:20px;height:20px}
.login-loading{display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--text3);font-size:12px}
.spinner{width:24px;height:24px;border:2.5px solid rgba(255,255,255,0.1);border-top-color:var(--income);border-radius:50%;animation:spin 0.7s linear infinite}

.user-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(255,255,255,0.02);border-bottom:1px solid var(--border)}
.user-avatar{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--income)}
.user-name{font-size:11px;font-weight:600;color:var(--text2)}
.sync-status{display:flex;align-items:center;gap:4px;font-size:9px;color:var(--text3)}
.sync-dot{width:5px;height:5px;border-radius:50%}
.sync-dot.online{background:var(--savings)}
.sync-dot.saving{background:var(--income);animation:pulse 1s ease infinite}
.logout-btn{background:none;border:1px solid rgba(255,255,255,0.08);border-radius:7px;padding:4px 8px;color:var(--text3);font-size:9px;font-weight:500}

.header{padding:10px 12px 0;position:sticky;top:0;z-index:20;background:linear-gradient(to bottom,#0a0a12 85%,transparent)}
.header-label{font-size:9px;text-transform:uppercase;letter-spacing:2px;color:var(--text3);font-weight:600;margin-bottom:2px}
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.month-nav h1{font-size:20px;font-weight:800;letter-spacing:-0.5px}
.nav-btn{background:rgba(255,255,255,0.06);border:none;border-radius:8px;padding:7px 9px;color:#fff;display:flex;align-items:center}
.nav-btn:active{background:rgba(255,255,255,0.12)}

.content{padding:0 12px}

.overview{background:linear-gradient(135deg,rgba(251,191,36,0.06) 0%,rgba(52,211,153,0.04) 100%);border-radius:14px;padding:14px 12px;margin-bottom:10px;border:1px solid var(--border)}
.overview-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.overview-label{font-size:8px;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:2px}
.overview-income{font-size:22px;font-weight:800;color:var(--income);letter-spacing:-0.5px;font-family:var(--mono)}
.overview-remaining{font-size:16px;font-weight:700;font-family:var(--mono)}
.rings{display:flex;justify-content:space-around}
.ring-item{text-align:center}
.ring-wrap{position:relative;width:44px;height:44px;margin:0 auto 3px}
.ring-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;font-family:var(--mono)}
.ring-label{font-size:8px;color:var(--text3)}
.ring-amount{font-size:9px;font-weight:600;font-family:var(--mono)}

.actions{display:flex;gap:5px;margin-bottom:8px}
.action-btn{flex:1;padding:8px 2px;border-radius:8px;border:1px solid var(--border);background:var(--bg2);color:var(--text2);font-weight:600;font-size:10px;white-space:nowrap}
.action-btn:active{transform:scale(0.97)}
.action-btn.active{background:rgba(251,191,36,0.12);color:var(--income);border-color:rgba(251,191,36,0.2)}

.export-row{display:flex;gap:5px;margin-bottom:10px}
.export-btn{flex:1;padding:8px 0;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.02);color:var(--text3);font-weight:500;font-size:10px;display:flex;align-items:center;justify-content:center;gap:4px}
.export-btn:active{background:rgba(255,255,255,0.05)}
.backup-hint{font-size:9px;color:var(--text4);text-align:center;margin:-6px 0 10px;letter-spacing:0.3px}

.section{background:var(--bg2);border-radius:var(--radius);padding:12px 10px;margin-bottom:8px;border:1px solid var(--border)}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.section-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.section-info{margin-left:6px;flex:1}
.section-title{font-size:12px;font-weight:700}
.section-sub{font-size:8px;color:var(--text3);margin-top:1px}
.section-total{text-align:right}
.section-amount{font-size:14px;font-weight:700;font-family:var(--mono)}
.section-left{font-size:8px;margin-top:1px}
.usage-bar{height:3px;border-radius:2px;background:rgba(255,255,255,0.06);margin-bottom:8px;overflow:hidden}
.usage-fill{height:100%;border-radius:2px;transition:width 0.5s ease}

.item-row{display:flex;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,0.04);gap:3px}
.item-label{flex:1;color:var(--text2);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-cell{flex:1;min-width:0}
.item-cell .item-label{flex:none}
.item-expr{font-size:8.5px;color:var(--text4);font-family:var(--mono);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-amount{font-weight:600;font-size:11px;font-family:var(--mono);white-space:nowrap}
.item-btn{background:none;border:none;color:var(--text4);padding:3px;display:flex;align-items:center;flex-shrink:0}

.edit-row{display:flex;gap:4px;align-items:center;padding:5px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.edit-input{flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:7px;padding:7px 7px;color:#fff;font-size:11px;outline:none;min-width:0}
.edit-input:focus{border-color:rgba(255,255,255,0.25)}
.edit-amount{width:96px;text-align:right;flex-shrink:0;font-family:var(--mono)}
.edit-save{border:none;border-radius:7px;padding:7px 10px;font-weight:700;font-size:10px;color:#000;flex-shrink:0}

.add-btn{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:8px;background:none;border:1px dashed;border-radius:8px;padding:8px;font-size:10px;font-weight:500;width:100%}

.dash-card{background:var(--bg2);border-radius:var(--radius);padding:12px;margin-bottom:8px;border:1px solid var(--border)}
.dash-title{font-size:11px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.dash-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.03)}
.dash-row-label{color:var(--text2);font-size:10px}
.dash-row-val{font-weight:600;font-size:10px;font-family:var(--mono)}
.bar-wrap{margin-bottom:6px}
.bar-label{display:flex;justify-content:space-between;margin-bottom:2px}
.bar-label span{font-size:9px}
.bar-track{height:2px;border-radius:1px;background:rgba(255,255,255,0.04);overflow:hidden}
.bar-fill{height:100%;border-radius:1px;transition:width 0.5s ease}
.rule-track{height:4px;border-radius:2px;background:rgba(255,255,255,0.04);overflow:hidden;position:relative}
.rule-marker{position:absolute;top:0;bottom:0;width:1.5px;background:rgba(255,255,255,0.2);z-index:1}
.empty-msg{color:var(--text4);font-size:10px;text-align:center;padding:8px 0}

.reset-btn{width:100%;padding:8px;border-radius:8px;border:1px solid rgba(255,100,100,0.1);background:rgba(255,100,100,0.02);color:rgba(255,100,100,0.35);font-weight:500;font-size:10px;margin-top:6px}
.updated-by{text-align:center;padding:8px;font-size:8px;color:var(--text4);margin-top:4px}

/* Wealth view */
.big-card{background:linear-gradient(135deg,rgba(52,211,153,0.08),rgba(96,165,250,0.05));border:1px solid var(--border);border-radius:14px;padding:16px 14px;margin-bottom:10px}
.big-label{font-size:8px;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:3px}
.big-val{font-size:26px;font-weight:800;font-family:var(--mono);letter-spacing:-0.5px}
.big-sub{font-size:9px;color:var(--text3);margin-top:4px}
.sel-row{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.sel-row label{font-size:10px;color:var(--text3);white-space:nowrap}
.msel{flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:8px;padding:7px 8px;color:#fff;font-size:11px;outline:none}
.msel option{background:#14141c;color:#fff}
.mini-grid{display:flex;gap:8px;margin-top:10px}
.mini-box{flex:1;background:rgba(255,255,255,0.03);border-radius:10px;padding:8px;text-align:center}
.mini-box .v{font-size:13px;font-weight:700;font-family:var(--mono)}
.rec-grid{display:flex;gap:6px;margin-bottom:8px}
.rec-f{flex:1;min-width:0}
.rec-f label{display:block;font-size:9px;color:var(--text3);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-f input{width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:8px 7px;color:#fff;font-size:12px;font-family:var(--mono);outline:none}
.rec-f input:focus{border-color:rgba(52,211,153,0.45)}
.rec-chk{display:flex;align-items:center;gap:6px;font-size:9.5px;color:var(--text3);margin-bottom:8px}
.rec-chk input{width:13px;height:13px;accent-color:#34d399}
.rec-save{width:100%;background:rgba(52,211,153,0.12);border:1px solid rgba(52,211,153,0.3);border-radius:9px;padding:9px;color:#34d399;font-size:11px;font-weight:700}
.rec-msg{font-size:10px;line-height:1.65;color:var(--text2);margin-top:10px;padding:9px 10px;border-radius:8px;background:rgba(255,255,255,0.03)}
.mini-box .l{font-size:8px;color:var(--text3);margin-top:2px}
.inv-head{display:flex;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.08);font-size:8px;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px}
.inv-row{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:11px}
.inv-c1{flex:1.5;min-width:0;overflow:hidden;color:var(--text2)}
.inv-c1>div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inv-sub{font-size:8px;color:var(--text3);margin-top:1px}
.inv-c2,.inv-c3,.inv-c4{flex:1;text-align:right;font-family:var(--mono);font-weight:600}
.inv-acts{width:44px;display:flex;justify-content:flex-end;flex-shrink:0}
.inv-total{display:flex;padding:10px 0 4px;border-top:2px solid rgba(255,255,255,0.1);margin-top:4px;font-size:12px;font-weight:800}
.sign-btn{flex:0 0 auto;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.16);border-radius:7px;padding:7px 11px;color:#fff;font-size:14px;font-weight:800;line-height:1}
.sign-btn:active{background:rgba(251,191,36,0.25)}
.inv-edit{display:flex;flex-wrap:wrap;gap:5px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.inv-edit input{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:7px;padding:7px;color:#fff;font-size:11px;outline:none;min-width:0}
.inv-edit .n{flex:1 1 100%}
.inv-edit .a{flex:1;text-align:right}
.tab-bar{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(10,10,18,0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:5px 0;padding-bottom:max(5px,env(safe-area-inset-bottom));z-index:30}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 0;background:none;border:none;color:var(--text3);font-size:8px;font-weight:500}
.tab.active{color:var(--income)}
.tab svg{width:16px;height:16px}

@media(min-width:768px){
  html{font-size:15px}
}

/* larger type on laptops and desktops */
@media (min-width:900px){
#app{max-width:1080px;margin:0 auto}
html{font-size:18.9px}
.quote-text{font-size:14.85px}
.login-sub{font-size:16.2px}
.login-btn{font-size:18.9px}
.login-loading{font-size:16.2px}
.user-name{font-size:14.85px}
.sync-status{font-size:12.15px}
.logout-btn{font-size:12.15px}
.header-label{font-size:12.15px}
.overview-label{font-size:10.8px}
.overview-remaining{font-size:21.6px}
.ring-pct{font-size:13.5px}
.ring-label{font-size:10.8px}
.ring-amount{font-size:12.15px}
.action-btn{font-size:13.5px}
.export-btn{font-size:13.5px}
.backup-hint{font-size:12.15px}
.section-icon{font-size:18.9px}
.section-title{font-size:16.2px}
.section-sub{font-size:10.8px}
.section-amount{font-size:18.9px}
.section-left{font-size:10.8px}
.item-label{font-size:14.85px}
.item-expr{font-size:11.48px}
.item-amount{font-size:14.85px}
.edit-input{font-size:14.85px}
.edit-save{font-size:13.5px}
.add-btn{font-size:13.5px}
.dash-title{font-size:14.85px}
.dash-row-label{font-size:13.5px}
.dash-row-val{font-size:13.5px}
.bar-label span{font-size:12.15px}
.empty-msg{font-size:13.5px}
.reset-btn{font-size:13.5px}
.updated-by{font-size:10.8px}
.big-label{font-size:10.8px}
.big-sub{font-size:12.15px}
.sel-row label{font-size:13.5px}
.msel{font-size:14.85px}
.mini-box .v{font-size:17.55px}
.rec-f label{font-size:12.15px}
.rec-f input{font-size:16.2px}
.rec-chk{font-size:12.83px}
.rec-save{font-size:14.85px}
.rec-msg{font-size:13.5px}
.mini-box .l{font-size:10.8px}
.inv-head{font-size:10.8px}
.inv-row{font-size:14.85px}
.inv-sub{font-size:10.8px}
.inv-total{font-size:16.2px}
.sign-btn{font-size:18.9px}
.inv-edit input{font-size:14.85px}
.tab{font-size:10.8px}
}
</style>
</head>
<body>

<div id="app"><div class="login-screen"><div class="login-loading"><div class="spinner"></div><span>Connecting...</span></div></div></div>

<script>
function loadScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}

// Fallback quotes in case API fails
var FALLBACK_QUOTES=[
  {q:"A budget is telling your money where to go instead of wondering where it went.",a:"Dave Ramsey"},
  {q:"Do not save what is left after spending, but spend what is left after saving.",a:"Warren Buffett"},
  {q:"The habit of saving is itself an education; it fosters every virtue, teaches self-denial, cultivates the sense of order.",a:"T.T. Munger"},
  {q:"Beware of little expenses. A small leak will sink a great ship.",a:"Benjamin Franklin"},
  {q:"It's not your salary that makes you rich, it's your spending habits.",a:"Charles A. Jaffe"},
  {q:"Financial freedom is available to those who learn about it and work for it.",a:"Robert Kiyosaki"},
  {q:"The art is not in making money, but in keeping it.",a:"Proverb"},
  {q:"Money looks better in the bank than on your feet.",a:"Sophia Amoruso"},
  {q:"Every time you borrow money, you're robbing your future self.",a:"Nathan W. Morris"},
  {q:"Wealth consists not in having great possessions, but in having few wants.",a:"Epictetus"},
  {q:"Rich people stay rich by living like they're broke. Broke people stay broke by living like they're rich.",a:"Unknown"},
  {q:"The best time to save money was yesterday. The next best time is today.",a:"Unknown"},
  {q:"Small amounts saved daily add up to huge investments in the end.",a:"Unknown"},
  {q:"Don't go broke trying to look rich. Act your wage.",a:"Unknown"},
  {q:"A penny saved is a penny earned.",a:"Benjamin Franklin"},
  {q:"Money saved today is freedom earned tomorrow.",a:"Unknown"},
  {q:"Live below your means but within your needs.",a:"Unknown"},
  {q:"You don't have to be rich to invest. You have to invest to be rich.",a:"Unknown"},
  {q:"Stop buying things you don't need to impress people you don't like.",a:"Suze Orman"},
  {q:"The goal isn't more money. The goal is living life on your terms.",a:"Chris Brogan"},
];

var currentQuote=null;

function getRandomFallback(){
  return FALLBACK_QUOTES[Math.floor(Math.random()*FALLBACK_QUOTES.length)];
}

async function fetchQuote(){
  // Always try API first for a fresh quote
  try{
    var resp=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-20250514",
        max_tokens:150,
        messages:[{role:"user",content:"Give me one short, unique, inspiring quote about saving money, budgeting, financial wisdom, or building wealth as a family. Be creative - avoid common overused quotes. Respond ONLY with JSON: {\"q\":\"the quote\",\"a\":\"author name\"}. No markdown, no backticks."}]
      })
    });
    var data=await resp.json();
    var text=data.content[0].text.trim();
    currentQuote=JSON.parse(text);
  }catch(e){
    console.log("Using fallback quote");
    currentQuote=getRandomFallback();
  }
}

// Start fetching quote immediately
fetchQuote().then(function(){
  // Re-render if app is already showing
  if(document.querySelector('.quote-banner'))renderQuote();
});

function renderQuote(){
  var el=document.querySelector('.quote-text');
  if(!el)return;
  if(currentQuote){
    el.innerHTML='"'+esc(currentQuote.q)+'" — <span>'+esc(currentQuote.a)+'</span>';
  }
}

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}

async function initApp(){
  try{
    await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
    await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js');

    if(!confirm("Restore this backup"+when+"?\n\nBackup contains: "+n+" month(s)\nApp currently has: "+cur+" month(s)\n\nThe backup will REPLACE everything in the app, for both of you. This cannot be undone."))return;
    if(!confirm("Last check — overwrite current data now?"))return;

    state.investments=(d.investments&&d.investments.length)?d.investments:null;

};

function isInAppBrowser(){
  var ua=navigator.userAgent||"";
  if(/FBAN|FBAV|FB_IAB|Instagram|Line\/|Twitter|MicroMessenger|WhatsApp|WABusiness|TikTok|Snapchat/i.test(ua))return true;
  // iOS webview: iOS device that is neither Safari nor a standalone PWA
  var iOS=/iPad|iPhone|iPod/.test(ua)&&!window.MSStream;
  if(iOS){
    var isSafari=/Safari/.test(ua)&&!/CriOS|FxiOS|EdgiOS/.test(ua);
    var isOtherRealBrowser=/CriOS|FxiOS|EdgiOS/.test(ua);
    var standalone=window.navigator.standalone===true;
    if(!isSafari&&!isOtherRealBrowser&&!standalone)return true;
  }
  return false;
}

  if(btn)btn.innerHTML='<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="G" style="width:20px;height:20px">Sign in with Google';
}

window.signInRedirect=function(){
  if(isLocalFile()){showAuthErr(authErrText({code:"auth/operation-not-supported-in-this-environment"}));return}
  auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider()).catch(function(e){
    showAuthErr(authErrText(e));
  });
};

window.signIn=function(){
  if(isInAppBrowser()){
    var w=document.getElementById('iab-warn');
    if(w)w.scrollIntoView({behavior:'smooth'});
    return;
  }
  if(isLocalFile()){showAuthErr(authErrText({code:"auth/operation-not-supported-in-this-environment"}));return}
  var btn=document.querySelector('.login-btn');
  if(btn)btn.innerHTML='<div class="spinner" style="width:18px;height:18px;border-width:2px"></div> Signing in...';
  // Called directly inside the click handler so the browser keeps the user-gesture
  auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function(err){
    resetLoginBtn();
    if(err.code==='auth/popup-closed-by-user'||err.code==='auth/cancelled-popup-request'){
      showAuthErr('');
    } else {
      showAuthErr(authErrText(err));
    }
  });
};
window.signOut=function(){if(unsub)unsub();auth.signOut()};
auth.onAuthStateChanged(function(u){state.user=u;if(u)startSync();else{state.data={};render()}});

function renderWealth(){
  var asOf=currentAsOf();
  var isPast=asOf<latestKey();
  var keys=allMonthKeys().filter(function(k){return k<=asOf});
  var range=cumRange().filter(function(k){return k<=asOf});
  var cumTotal=0;
  range.forEach(function(k){cumTotal+=savingsOf(k)});
  var avg=range.length?cumTotal/range.length:0;

  var h='<div class="header"><div class="header-label">Wealth</div><div class="month-nav"><h1 style="font-size:20px">Savings &amp; Assets</h1></div></div><div class="content">';

  // ── As-of month picker ──
  h+='<div class="dash-card fade-up" style="'+(isPast?'border-color:rgba(251,191,36,0.3);background:rgba(251,191,36,0.04)':'')+'"><div class="sel-row" style="margin-bottom:0"><label>Viewing</label><select class="msel" onchange="setAsOf(this.value)">';
  asOfOptions().slice().reverse().forEach(function(k){
    h+='<option value="'+k+'"'+(k===asOf?' selected':'')+'>'+keyLabel(k)+(k===latestKey()?' (latest)':'')+'</option>';
  });
  h+='</select></div>';
  if(isPast)h+='<div style="font-size:9px;color:#fbbf24;margin-top:8px;line-height:1.6">⏳ Historical view — showing where you stood at the end of '+keyLabel(asOf)+'. Editing here records values against that month.</div>';
  h+='</div>';

  // ── Cumulative savings ──
  h+='<div class="big-card fade-up"><div class="big-label">Total Contributed</div><div class="big-val" style="color:var(--savings)">'+cur(cumTotal)+'</div>';
  h+='<div class="big-sub">'+(range.length?keyLabel(range[0])+' → '+keyLabel(range[range.length-1])+' &bull; '+range.length+' month'+(range.length>1?'s':''):'No data yet')+'</div>';
  h+='<div class="mini-grid"><div class="mini-box"><div class="v" style="color:var(--savings)">'+cur(avg)+'</div><div class="l">Avg / month</div></div><div class="mini-box"><div class="v" style="color:var(--needs)">'+range.length+'</div><div class="l">Months counted</div></div></div>';
  h+='<div class="big-sub" style="margin-top:8px;color:var(--text4)">This is your savings rate, not a separate pot — the money already sits in your holdings below.</div></div>';

  // Start month selector
  h+='<div class="dash-card fade-up d1"><div class="sel-row"><label>Count from</label><select class="msel" onchange="setCumStart(this.value)">';
  if(!keys.length){h+='<option>No months yet</option>'}
  keys.forEach(function(k){
    var sel=(range.length&&k===range[0])?' selected':'';
    h+='<option value="'+k+'"'+sel+'>'+keyLabel(k)+'</option>';
  });
  h+='</select></div>';

  // Per-month list
  if(range.length){
    h+='<div class="dash-title" style="color:var(--savings);margin-top:4px">📈 Monthly Savings</div>';
    var max=0;range.forEach(function(k){var v=savingsOf(k);if(v>max)max=v});
    range.slice().reverse().forEach(function(k){
      var v=savingsOf(k),w=max>0?(v/max*100):0;
      h+='<div class="bar-wrap"><div class="bar-label"><span style="color:var(--text2)">'+keyLabel(k)+'</span><span style="color:var(--text2);font-family:var(--mono)">'+cur(v)+'</span></div><div class="bar-track"><div class="bar-fill" style="width:'+w+'%;background:var(--savings)"></div></div></div>';
    });
  }
  h+='</div>';

  // ── Holdings (auto-linked to monthly savings) ──
  var inv=getInv();
  var sumAdd=0,sumPL=0,cashBal=0,investBal=0;

  inv.forEach(function(r){

// Wealth actions
window.setCumStart=function(v){state.cumStart=v;pushAll()};
window.toggleDanger=function(){state.showDanger=!state.showDanger;render()};
// ± toggle for loss values (iOS number pad has no minus key)
window.setAsOf=function(v){state.asOf=v;state.invEditing=null;state.fixEditing=null;render()};
window.flipSign=function(id){
  var e=document.getElementById(id);if(!e)return;
  var v=(e.value||"").trim();
  if(v.charAt(0)==='-'){e.value=v.slice(1)}
  else if(v===''||v==='0'){e.value='-'}
  else{e.value='-'+v}
  e.focus();
};
function evalExpr(raw){
  if(raw===null||raw===undefined)return null;
  var t=String(raw).replace(/[,$\s]/g,"");
  if(t==="")return null;
  if(!/^[0-9.+\-*/()]+$/.test(t))return null;
  var i=0;
  function pk(){return t.charAt(i)}
  function fac(){
    if(pk()==="+"){i++;return fac()}
    if(pk()==="-"){i++;var f=fac();return f===null?null:-f}
    if(pk()==="("){i++;var v=exp();if(v===null||pk()!==")")return null;i++;return v}
    var st=i;
    while(i<t.length&&/[0-9.]/.test(t.charAt(i)))i++;
    if(st===i)return null;
    var n=parseFloat(t.slice(st,i));
    return isNaN(n)?null:n;
  }
  function trm(){
    var v=fac();if(v===null)return null;
    while(pk()==="*"||pk()==="/"){
      var op=t.charAt(i++),r=fac();
      if(r===null)return null;
      if(op==="/"){if(r===0)return null;v=v/r}else{v=v*r}
    }
    return v;
  }
  function exp(){
    var v=trm();if(v===null)return null;
    while(pk()==="+"||pk()==="-"){
      var op=t.charAt(i++),r=trm();
      if(r===null)return null;
      v=(op==="+")?v+r:v-r;
    }
    return v;
  }
  var val=exp();
  if(val===null||i<t.length||!isFinite(val))return null;
  return Math.round(val*100)/100;
}
function isExpr(raw){
  var t=String(raw===null||raw===undefined?"":raw).replace(/[,$\s]/g,"");
  return /[+*/]/.test(t)||/[0-9)]-/.test(t);
}
function num(id){
  var e=document.getElementById(id);if(!e)return 0;
  var v=evalExpr(e.value);
  if(v!==null)return v;
  var f=parseFloat(String(e.value).replace(/[^0-9.\-]/g,''));
  return isNaN(f)?0:f;
}

window.editInvRow=function(id){state.invEditing=id;state.fixEditing=null;render();setTimeout(function(){var e=document.getElementById('iv-name');if(e)e.focus()},50)};
window.saveInvRow=function(id){
  var list=clone(getInv());
  var name=document.getElementById('iv-name').value.trim();
  var linkEl=document.getElementById('iv-link');
  var link=linkEl?linkEl.value:"";
  var typeEl=document.getElementById('iv-type');
  var type=typeEl?typeEl.value:'invest';
  var asOf=currentAsOf();
  var opening=num('iv-open'),pl=(type==='cash'?0:num('iv-pl'));
  list=list.map(function(r){
    if(r.id!==id)return r;
    var hist=clone(r.plHist||{});
    if(type==='cash'){delete hist[asOf]}else{hist[asOf]=pl}
    return {id:id,name:name||r.name,opening:opening,pl:pl,plHist:hist,link:link,type:type};
  });
  state.invEditing=null;saveInv(list);
};
window.delInvRow=function(id){
  if(!confirm("Delete this asset?"))return;
  saveInv(clone(getInv()).filter(function(r){return r.id!==id}));
};
window.addInvRow=function(){
  var list=clone(getInv()),nid=uid();

// Create a holding for every monthly savings row that isn't linked yet
window.createFromLabels=function(){
  var list=clone(getInv());
  var linked={};list.forEach(function(r){if(r.link)linked[r.link]=true});
  var added=0;
  allSavingsLabels().forEach(function(l){
    if(!linked[l]){list.push({id:uid(),name:l,opening:0,pl:0,plHist:{},link:l,type:"invest"});added++}
  });
  if(added)saveInv(list);
};

// Fixed assets (land / property)
window.editFixRow=function(id){state.fixEditing=id;state.invEditing=null;render();setTimeout(function(){var e=document.getElementById('fx-name');if(e)e.focus()},50)};
window.saveFixRow=function(id){
  var list=clone(getFixed());
  var name=document.getElementById('fx-name').value.trim();
  var cost=num('fx-cost'),val=num('fx-val');
  var asOf=currentAsOf();
  list=list.map(function(r){
    if(r.id!==id)return r;
    var hist=clone(r.valHist||{});
    if(val>0){hist[asOf]=val}else{delete hist[asOf]}
    return {id:id,name:name||r.name,cost:cost,val:val,valHist:hist};
  });
  state.fixEditing=null;saveFixed(list);
};
window.delFixRow=function(id){
  if(!confirm("Delete this property?"))return;
  saveFixed(clone(getFixed()).filter(function(r){return r.id!==id}));
};
window.addFixRow=function(){
  var list=clone(getFixed()),nid=uid();
  list.push({id:nid,name:"New Property",cost:0,val:0,valHist:{}});
  state.fixEditing=nid;state.invEditing=null;saveFixed(list);
};

// Delete every month earlier than the one selected
window.purgeBefore=function(){
  if(!backedUpToday()){alert("Take a backup first.\n\nTap “Back up now to unlock”, check the downloaded file, then try again.");return}
  var el=document.getElementById('purge-sel');if(!el)return;
  var cut=el.value;
  var doomed=Object.keys(state.data).filter(function(k){return k<cut});
  if(!doomed.length){alert("Nothing to delete — that's already the earliest month.");return}
  var names=doomed.map(keyLabel).join(", ");
  if(!confirm("Permanently delete "+doomed.length+" month"+(doomed.length>1?"s":"")+"?\n\n"+names+"\n\nThis affects both of you and can't be undone."))return;
  var typed=prompt("Type DELETE in capitals to confirm removing "+doomed.length+" month"+(doomed.length>1?"s":"")+".");
  if(typed!=="DELETE"){alert("Cancelled. Nothing was deleted.");return}
  doomed.forEach(function(k){delete state.data[k]});
  if(state.cumStart&&state.cumStart<cut)state.cumStart=cut;
  pushAll();
};

window.exportWealthCSV=function(){
  var aoK=currentAsOf();
  var range=cumRange().filter(function(k){return k<=aoK}),rows=[["Wealth Report"],["As of",keyLabel(aoK)],["Generated",new Date().toLocaleString()],[""],["MONTHLY CONTRIBUTIONS (savings rate)"],["Month","Contributed"]];
  var cum=0;range.forEach(function(k){var v=savingsOf(k);cum+=v;rows.push([keyLabel(k),v.toFixed(2)])});
  rows.push(["TOTAL CONTRIBUTED",cum.toFixed(2)]);rows.push([""]);
  rows.push(["HOLDINGS"]);rows.push(["Asset","Type","Linked monthly row","Starting amount","Auto-added","Balance","Unrealised P/L","Total"]);
  var so=0,sa=0,sp=0;
  var asOf=currentAsOf();
  getInv().forEach(function(r){
    var add=contribFor(r.link,asOf),invd=(r.opening||0)+add;
    var sn=histAsOf(r.plHist,asOf),plv=sn?sn.val:0;
    so+=(r.opening||0);sa+=add;sp+=plv;
    rows.push([r.name,(r.type==='cash'?"Cash":"Investment"),r.link||"—",(r.opening||0).toFixed(2),add.toFixed(2),invd.toFixed(2),plv.toFixed(2),(invd+plv).toFixed(2)]);
  });
  var si=so+sa;
  rows.push(["TOTAL","","",so.toFixed(2),sa.toFixed(2),si.toFixed(2),sp.toFixed(2),(si+sp).toFixed(2)]);
  rows.push([""]);
  rows.push(["FIXED ASSETS (LAND / PROPERTY)"]);rows.push(["Asset","Cost Paid","Current Value","Change"]);
  var fc=0,fv=0;
  getFixed().forEach(function(r){var vv=fixValAsOf(r,asOf).val;fc+=(r.cost||0);fv+=vv;rows.push([r.name,(r.cost||0).toFixed(2),vv.toFixed(2),(vv-(r.cost||0)).toFixed(2)])});
  rows.push(["TOTAL",fc.toFixed(2),fv.toFixed(2),(fv-fc).toFixed(2)]);
  rows.push([""]);
  rows.push(["NET WORTH"]);
  rows.push(["Holdings Value",(si+sp).toFixed(2)]);
  rows.push(["Property Value",fv.toFixed(2)]);
  rows.push(["TOTAL NET WORTH",(si+sp+fv).toFixed(2)]);
  var csv=rows.map(function(r){return r.map(function(c){return'"'+String(c).replace(/"/g,'""')+'"'}).join(",")}).join("\n");
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="Wealth_"+aoK+".csv";a.click();
};

function recF(id,label,val){
  return'<div class="rec-f"><label>'+label+'</label><input id="'+id+'" type="text" inputmode="text" value="'+(typeof val==="number"?val:"")+'" placeholder="0.00"></div>';
}
function prevReconClose(){
  var pm=state.month===0?11:state.month-1,py=state.month===0?state.year-1:state.year;
  var m=state.data[mkey(py,pm)];
  if(m&&m.recon&&typeof m.recon.close==="number")return{val:m.recon.close,label:MONTHS[pm]+" "+py};
  return null;
}
function reconCard(md,ti,tn,tw,ts){
  var rc=md.recon||{};
  var moneyIn=(typeof rc.inAmt==="number")?rc.inAmt:ti;
  var savingsOut=rc.savingsOut!==false;
  var planned=tn+tw+(savingsOut?ts:0);
  var carry=(typeof rc.open==="number")?null:prevReconClose();
  var openVal=(typeof rc.open==="number")?rc.open:(carry?carry.val:null);
  var ready=(typeof openVal==="number"&&typeof rc.close==="number");
  var h='<div class="dash-card fade-up d4" style="border-color:rgba(52,211,153,0.18)">';
  h+='<div class="dash-title" style="color:var(--savings)">\u2696\ufe0f Reconcile '+MONTHS[state.month]+' '+state.year+'</div>';
  h+='<div style="font-size:10px;color:var(--text3);line-height:1.6;margin-bottom:10px">Balances beat memory. At month end, type what the account started and ended with \u2014 the gap finds itself.</div>';
  h+='<div class="rec-grid">'+recF("rec-open","Opening",openVal)+recF("rec-in","Money in",moneyIn)+recF("rec-close","Closing",rc.close)+'</div>';
  if(carry)h+='<div style="font-size:9px;color:var(--text4);margin:-4px 0 8px">Opening carried from '+esc(carry.label)+' closing. Change it if your bank says otherwise.</div>';
  if(Math.round(moneyIn*100)!==Math.round(ti*100))h+='<div style="font-size:9px;color:var(--text4);margin:-4px 0 8px">Money in differs from this month\'s income. <button onclick="syncMoneyIn()" style="background:none;border:none;color:var(--income);font-size:9px;text-decoration:underline;padding:0">Use '+cur(ti)+'</button></div>';
  var dbl=0;
  (md.income||[]).forEach(function(i){if(/carr(y|ied)\s*forwa|brought\s*forwa|^b\/f|last month/i.test(i.label||""))dbl+=(i.amount||0)});
  if(dbl>0&&typeof openVal==="number"&&openVal>0){
    h+='<div style="font-size:9.5px;line-height:1.6;margin-bottom:8px;padding:8px 10px;border-radius:8px;background:rgba(255,107,107,0.08);border:1px solid rgba(255,107,107,0.25);color:#ff9b9b">\u26a0\ufe0f Counted twice: '+cur(dbl)+' sits in an income row <b>and</b> in Opening. Delete that income row, or set Opening to 0 \u2014 not both. Until then the gap is wrong by '+cur(dbl)+'.</div>';
  }
  h+='<label class="rec-chk"><input type="checkbox" id="rec-sv"'+(savingsOut?" checked":"")+'> Savings transfers leave this account</label>';
  h+='<button class="rec-save" onclick="saveRecon()">Save reconciliation</button>';
  if(ready){
    var expected=openVal+moneyIn-planned;
    var gap=Math.round((expected-rc.close)*100)/100;
    var gc=Math.abs(gap)<1?"var(--savings)":(gap>0?"var(--danger)":"var(--income)");
    h+='<div class="mini-grid"><div class="mini-box"><div class="v" style="color:var(--needs)">'+cur(expected)+'</div><div class="l">Plan says close with</div></div>'+
       '<div class="mini-box"><div class="v" style="color:var(--text2)">'+cur(rc.close)+'</div><div class="l">Bank says</div></div>'+
       '<div class="mini-box"><div class="v" style="color:'+gc+'">'+cur(gap)+'</div><div class="l">Gap</div></div></div>';
    h+='<div class="rec-msg" style="font-family:var(--mono);font-size:9.5px;color:var(--text3)">'+
       cur(openVal)+' carried in &nbsp;+&nbsp; '+cur(moneyIn)+' money in &nbsp;\u2212&nbsp; '+cur(planned)+' planned out &nbsp;=&nbsp; '+cur(expected)+'</div>';
    var msg;
    if(Math.abs(gap)<1)msg="It tallies. Everything that left the account is in your rows.";
    else if(gap>0)msg="The bank has "+cur(gap)+" less than the plan predicts. That is spending neither of you wrote down. Add it as one row and this month closes at zero.";
    else msg="The bank has "+cur(-gap)+" more than the plan predicts. You spent less than planned, or some money in was not counted. Move it to savings before it disappears.";
    h+='<div class="rec-msg">'+msg+'</div>';
    if(gap>=1)h+='<button class="rec-save" style="margin-top:8px;background:rgba(96,165,250,0.12);border-color:rgba(96,165,250,0.3);color:#60a5fa" onclick="addUntracked('+gap+')">\u2795 Add '+cur(gap)+' as \u201cUntracked spending\u201d</button>';
  } else {
    h+='<div class="empty-msg">Enter opening and closing balance to see the gap</div>';
  }
  h+='</div>';
  return h;
}
function rSec(section,title,icon,color,budget,totalIncome,items){
  var total=0;items.forEach(function(i){total+=i.amount});
  var ba=totalIncome*budget/100,rm=ba-total,up=ba>0?pct(total,ba):0;
  var h='<div class="section fade-up d2"><div class="section-header"><div style="display:flex;align-items:center"><div class="section-icon" style="background:'+color+'18">'+icon+'</div><div class="section-info"><div class="section-title">'+title+'</div><div class="section-sub">'+budget+'% &bull; '+cur(ba)+'</div></div></div><div class="section-total"><div class="section-amount" style="color:'+color+'">'+cur(total)+'</div><div class="section-left" style="color:'+(rm>=0?"var(--text3)":"var(--danger)")+'">'+(rm>=0?cur(rm)+' left':cur(Math.abs(rm))+' over')+'</div></div></div><div class="usage-bar"><div class="usage-fill" style="width:'+Math.min(up,100)+'%;background:'+(up>100?"var(--danger)":color)+'"></div></div>';
  items.forEach(function(item){
    if(state.editing&&state.editing.section===section&&state.editing.id===item.id){
      h+='<div class="edit-row"><input class="edit-input" id="edit-label-input" value="'+esc(item.label)+'" onkeydown="if(event.key===\'Enter\')saveEdit(\''+section+'\',\''+item.id+'\')"><input class="edit-input edit-amount" id="edit-amount-input" type="text" inputmode="text" placeholder="4056+125" value="'+esc(item.expr?item.expr:String(item.amount))+'" onkeydown="if(event.key===\'Enter\')saveEdit(\''+section+'\',\''+item.id+'\')"><button class="edit-save" style="background:'+color+'" onclick="saveEdit(\''+section+'\',\''+item.id+'\')">OK</button></div>';
    } else {
      h+='<div class="item-row"><div class="item-cell"><div class="item-label">'+esc(item.label)+'</div>'+(item.expr?'<div class="item-expr">= '+esc(item.expr)+'</div>':'')+'</div><span class="item-amount" style="color:'+color+'">'+cur(item.amount)+'</span><button class="item-btn" onclick="startEdit(\''+section+'\',\''+item.id+'\')">'+eico()+'</button><button class="item-btn" onclick="deleteItem(\''+section+'\',\''+item.id+'\')">'+dico()+'</button></div>';
    }
  });
  h+='<button class="add-btn" style="color:'+color+'aa;border-color:'+color+'30" onclick="addItem(\''+section+'\')">'+pico()+' Add</button></div>';
  return h;
}

// ACTIONS
window.prevMonth=function(){state.editing=null;if(state.month===0){state.month=11;state.year--}else state.month--;render()};
window.nextMonth=function(){state.editing=null;if(state.month===11){state.month=0;state.year++}else state.month++;render()};
window.switchView=function(v){state.view=v;state.editing=null;render()};
window.startEdit=function(s,id){state.editing={section:s,id:id};render()};
window.saveEdit=function(sec,id){
  var md=getMonth();
  var lbl=document.getElementById("edit-label-input").value.trim();
  var raw=document.getElementById("edit-amount-input").value;
  var amt=evalExpr(raw);
  if(amt===null){alert("I could not read that amount.\n\nUse numbers and + - \u00d7 \u00f7 only, for example:\n4056+125\n900-50\n12*4");return}
  var keep=isExpr(raw);
  md[sec]=md[sec].map(function(i){
    if(i.id!==id)return i;
    var o={id:i.id,label:lbl||i.label,amount:amt};
    if(keep)o.expr=String(raw).replace(/\s+/g," ").trim();
    return o;
  });
  state.editing=null;save(md);
};
window.deleteItem=function(s,id){var md=getMonth();md[s]=md[s].filter(function(i){return i.id!==id});save(md)};
window.addItem=function(s){var md=getMonth(),nid=uid();md[s].push({id:nid,label:"New Item",amount:0});state.editing={section:s,id:nid};save(md)};
window.copyPrev=function(){var pm=state.month===0?11:state.month-1,py=state.month===0?state.year-1:state.year,prev=state.data[mkey(py,pm)];if(prev){var c=clone(prev);delete c.recon;c.wants=c.wants.map(function(i){return{id:i.id,label:i.label,amount:0}});save(c)}else alert("No data for previous month")};
window.syncMoneyIn=function(){
  var md=clone(getMonth());
  var ti=0;(md.income||[]).forEach(function(i){ti+=(i.amount||0)});
  md.recon=md.recon||{};
  md.recon.inAmt=Math.round(ti*100)/100;
  save(md);
};
window.addUntracked=function(amt){
  amt=Math.round(amt*100)/100;
  if(!confirm("Add "+cur(amt)+" as \u201cUntracked spending\u201d under Needs for "+MONTHS[state.month]+" "+state.year+"?\n\nThis closes the gap by recording what you actually spent."))return;
  var md=clone(getMonth());
  var hit=null;
  (md.needs||[]).forEach(function(i){if(i.label==="Untracked spending")hit=i});
  if(hit){hit.amount=Math.round((hit.amount+amt)*100)/100;delete hit.expr}
  else{md.needs=(md.needs||[]).concat([{id:uid(),label:"Untracked spending",amount:amt}])}
  save(md);
};
window.saveRecon=function(){
  function v(el){if(!el)return null;if(String(el.value).trim()==='')return null;return evalExpr(el.value)}
  var md=clone(getMonth());
  md.recon={
    open:v(document.getElementById('rec-open')),
    inAmt:v(document.getElementById('rec-in')),
    close:v(document.getElementById('rec-close')),
    savingsOut:(function(){var e=document.getElementById('rec-sv');return e?e.checked:true})()
  };
  save(md);
};
window.resetMonth=function(){
  if(!confirm("Reset "+MONTHS[state.month]+" "+state.year+" back to the default rows?\n\nEverything you entered for this month is wiped, for both of you. There is no undo."))return;
  var t=prompt("Type RESET in capitals to confirm.");
  if(t!=="RESET"){alert("Cancelled. Nothing was changed.");return}
  state.editing=null;save(emptyMonth());
};
window.toggleReset=function(){state.showReset=!state.showReset;render()};

} // end startApp
initApp();
</script>
</body>
